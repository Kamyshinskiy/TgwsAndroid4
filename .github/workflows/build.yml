name: Build Proxy
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust
        run: |
          rustup target add armv7-linux-androideabi
      - name: Build Code
        run: |
          cargo install tg-ws-proxy-rs --target armv7-linux-androideabi --root .
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgproxy
          path: bin/tg-ws-proxy-rs
