name: Build Proxy
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install Rust + target
        run: rustup target add armv7-linux-androideabi

      - name: Configure cross-compiler
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.armv7-linux-androideabi]
          linker = "armv7a-linux-androideabi19-clang"
          ar = "llvm-ar"
          EOF
          # Добавляем NDK toolchain в PATH
          echo "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Build
        env:
          CC_armv7_linux_androideabi: armv7a-linux-androideabi19-clang
          CXX_armv7_linux_androideabi: armv7a-linux-androideabi19-clang++
          AR_armv7_linux_androideabi: llvm-ar
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: armv7a-linux-androideabi19-clang
        run: |
          cargo install tg-ws-proxy-rs \
            --target armv7-linux-androideabi \
            --root .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgproxy
          path: bin/tg-ws-proxy-rs
