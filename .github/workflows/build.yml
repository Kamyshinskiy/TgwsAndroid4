name: Build Proxy
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Install Rust + target
        run: rustup target add armv7-linux-androideabi

      - name: Build
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$NDK_BIN:$PATH"
          export CC_armv7_linux_androideabi="$NDK_BIN/armv7a-linux-androideabi19-clang"
          export CXX_armv7_linux_androideabi="$NDK_BIN/armv7a-linux-androideabi19-clang++"
          export AR_armv7_linux_androideabi="$NDK_BIN/llvm-ar"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$NDK_BIN/armv7a-linux-androideabi19-clang"
          
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml << EOF
          [target.armv7-linux-androideabi]
          linker = "$NDK_BIN/armv7a-linux-androideabi19-clang"
          ar = "$NDK_BIN/llvm-ar"
          EOF
          
          cargo install tg-ws-proxy-rs \
            --target armv7-linux-androideabi \
            --root .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgproxy
          path: bin/tg-ws-proxy-rs
